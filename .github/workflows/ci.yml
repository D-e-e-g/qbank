name: CI

# Pull requests and pushes to main run these checks on GitHub's hosted Linux:
# this workflow references no secrets, reads the repository with a read-only
# token, and never runs on a Mac. The Swift packages and the app build and test
# on a Mac in xcode.yml (see docs/ci.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell scripts pass shellcheck
        run: shellcheck test/*.sh scripts/*.sh

      - name: Repository and pipeline rules
        run: ./test/release-checks.sh

      # SwiftLint 0.65.1, pinned like gitleaks. The zip's dynamic binary runs
      # every enabled rule. The static one is built with SourceKit disabled and
      # skips custom rules; in 0.65.1 a custom rule still reads the SourceKit
      # syntax map, so no_print needs libsourcekitdInProc.so from the Swift
      # toolchain already on this Ubuntu image.
      - name: Install SwiftLint
        run: |
          version=0.65.1
          sha256=caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$version/swiftlint_linux_amd64.zip"
          echo "$sha256  $RUNNER_TEMP/swiftlint.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/swiftlint"
          swift_bin=$(command -v swift)
          libsourcekit="$(dirname "$(dirname "$(readlink -f "$swift_bin")")")/lib/libsourcekitdInProc.so"
          test -f "$libsourcekit"
          if ldd "$RUNNER_TEMP/swiftlint" | grep -q 'not found'; then
            sudo apt-get update
            sudo apt-get install -y libcurl4 libxml2
          fi

      - name: SwiftLint
        run: |
          "$RUNNER_TEMP/swiftlint" lint

  # A change must not add a secret; see test/leak-check.sh.
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          echo "$sha256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Check the change and the files for secrets
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: ./test/leak-check.sh "$BASE" "$HEAD"
