name: Xcode

# Builds and tests the app on a Mac. Runs only for trusted code: pull requests
# from this repository's own branches, pushes to main, qbank-v* tags, and
# manual runs. A fork's pull request never reaches the Mac (see docs/ci.md).
# A pull request runs the quick check unless it changes shared test machinery
# or a path test/pr-suite.sh does not know, in which case it runs the full
# suite. Pushes to main, tags, and manual runs run the full suite. The full
# suite on main is meant to take about 80 minutes of work, watched as a weekly
# median, not as a limit that fails the job (see docs/ci.md). A manual run can
# ask for the quick check with suite=quick. After a test fails, retry only that
# test with the only_testing input before spending the suite again (see
# docs/testing.md).
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'qbank-v*'
  workflow_dispatch:
    inputs:
      only_testing:
        description: 'Run only these tests, then stop: Target/Class/test names separated by spaces (see docs/testing.md). Empty runs everything.'
        type: string
        required: false
        default: ''
      device:
        description: 'The simulator for only_testing'
        type: choice
        options:
          - iphone
          - ipad
        default: iphone
      suite:
        description: 'Manual runs only. full (the default) runs the whole suite. quick runs the pull request check, so it can be timed on a branch.'
        type: choice
        options:
          - full
          - quick
        default: full

permissions:
  contents: read

jobs:
  # Decides on GitHub's Linux, before any Mac is asked for, what a run needs.
  # A pull request that changes only documentation or CI files skips the Mac.
  # Any other pull request builds: the quick check, or the full suite when
  # test/pr-suite.sh is unsure or the change touches shared test machinery.
  # A push to main, a tag, or a manual run always runs the full suite. A manual
  # run with suite=quick runs the quick check instead, so it can be timed.
  # A named-tests run's names are checked here too, so a bad one fails without
  # waiting for the Mac.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.scope.outputs.mac }}
      ipad: ${{ steps.scope.outputs.ipad }}
      plan: ${{ steps.scope.outputs.plan }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the named tests
        if: inputs.only_testing != ''
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: ./test/only-testing.sh --check

      # A pull request's checkout is its merge commit, so the first parent is
      # the base. If the diff cannot be read, the full suite runs.
      - name: Decide whether the Mac is needed
        id: scope
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          mac=true
          ipad=true
          plan="$(printf '%s\n' mode=full ipad=true)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if files="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
              plan="$(printf '%s\n' "$files" | ./test/pr-suite.sh)"
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$SUITE" = quick ]; then
            if git fetch --no-tags --depth=1 origin main &&
              files="$(git diff --name-only --no-renames FETCH_HEAD HEAD)"; then
              plan="$(printf '%s\n' "$files" | ./test/pr-suite.sh --as-quick)"
            fi
          fi
          # First two lines, without a pipe: pipefail would turn head's early exit into a failure.
          mode="${plan%%$'\n'*}"
          ipad_line="${plan#*$'\n'}"
          ipad_line="${ipad_line%%$'\n'*}"
          case "$mode" in
            mode=skip) mac=false ;;
            mode=quick | mode=full) mac=true ;;
            *)
              mac=true
              plan="$(printf '%s\n' mode=full ipad=true)"
              ipad_line="ipad=true"
              ;;
          esac
          case "$ipad_line" in
            ipad=true) ipad=true ;;
            ipad=false) ipad=false ;;
            *) ipad=true ;;
          esac
          if [ "$mac" = false ]; then
            ipad=false
          fi
          {
            echo "mac=$mac"
            echo "ipad=$ipad"
            echo "plan<<END_PR_SUITE"
            printf '%s\n' "$plan"
            echo "END_PR_SUITE"
          } >> "$GITHUB_OUTPUT"

  # A pull request or a push to main builds only on the self-hosted MAC_RUNNER.
  # With no MAC_RUNNER the build would fall back to a GitHub-hosted Mac on every
  # merge, so it is skipped and this job says why. It also says why a fork's
  # pull request, or a documentation-only or CI-only pull request, skips the build.
  mac-build-skipped:
    name: Mac build skipped
    needs: scope
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != 'D-e-e-g/qbank'
      || vars.MAC_RUNNER == '' && (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main')
      || needs.scope.outputs.mac == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Explain the skip
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          NEEDS_MAC: ${{ needs.scope.outputs.mac }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            message="This pull request comes from a fork, so it skips the Mac build: the self-hosted Mac builds only this repository's own branches (see docs/ci.md)."
          elif [ "$NEEDS_MAC" = false ]; then
            message="This pull request changes only documentation or CI files and scripts, so it skips the Mac build. test/pr-suite.sh names those paths. Shared test machinery still builds, and merging still runs the full suite on main."
          else
            message="MAC_RUNNER is not set, so this run skips the Mac build. Set it to the self-hosted runner's label (see docs/ci.md)."
          fi
          echo "::notice title=Mac build skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  # A pull request builds only when it comes from a branch of this repository,
  # never a fork, and only on the MacBook Pro 14's runner, whose job-started
  # hook checks the same thing again; never on a GitHub-hosted Mac.
  build-and-test:
    name: Build and test
    needs: scope
    if: >-
      needs.scope.outputs.mac == 'true' && inputs.only_testing == '' && (
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'D-e-e-g/qbank' && vars.MAC_RUNNER != ''
      || github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.MAC_RUNNER != '')
      )
    runs-on: ${{ github.event_name == 'pull_request' && 'qbank-macbook-14' || vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 150

    # A pull request's new commit cancels its previous build. Every other run
    # shares one group, because a self-hosted MAC_RUNNER shares its Mac with
    # other CI: a new run waits for the running one, and GitHub keeps one
    # waiting run and replaces it with a newer one, so a burst of pushes to
    # main builds the latest. The one runner on the Mac runs one job at a time.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('xcode-pr-{0}', github.event.pull_request.number) || 'xcode-mac' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      PROJECT_PATH: QBank.xcodeproj
      SCHEME: QBank
      DERIVED_DATA_PATH: .build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEVELOPER_DIR, not `sudo xcode-select`: a self-hosted MAC_RUNNER has no
      # passwordless sudo, and GITHUB_ENV carries the choice to later steps.
      # /Applications/Xcode.app is the image's default Xcode on GitHub's Macs
      # and the App Store install on a self-hosted one.
      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Swift packages
        run: ./test/package-tests.sh

      # The Debug-only launch seam can compile in Debug yet break a Release
      # build. This compiles Release for a device with no signing, which is the
      # same compiler boundary a TestFlight archive crosses. It takes under a
      # minute, so it goes before the tests.
      - name: Build Release configuration (compile only)
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # test/sim.sh owns the simulator: it creates one run-scoped device, boots
      # it, and deletes it on every exit path. Never target a simulator here
      # directly. After a failure xcodebuild would gather simulator diagnostics,
      # which can wait without end; the result bundle is uploaded instead.
      # The full suite runs every test. A quick check runs the unit tests, the
      # smoke walk, and the UI test classes the change touched (see docs/ci.md).
      # The names come from the scope job through env, and test/pr-suite.sh
      # refuses anything but a test name before they reach xcodebuild.
      # The 80-minute figure in docs/ci.md is the watched length of the whole
      # run, not this step's limit. The serial iPhone suite took 55 to 57
      # minutes before the highlight tests and about 4 minutes more with them,
      # so the full suite gets 90 minutes instead of sim.sh's 60-minute
      # default. The iPad step took 16 to 29 minutes and gets 45. Both still
      # stop hangs.
      - name: Build and run unit and UI tests
        env:
          PR_SUITE: ${{ needs.scope.outputs.plan }}
        run: |
          args="$(printf '%s\n' "$PR_SUITE" | ./test/pr-suite.sh --flags iphone)"
          only=()
          case "$args" in
            full)
              echo "Running the full suite."
              ;;
            -only-testing:*)
              echo "Running the quick check."
              set -f
              # shellcheck disable=SC2206 # flags are validated words with no spaces
              only=($args)
              set +f
              for flag in "${only[@]}"; do
                case "$flag" in
                  -only-testing:QBankTests | -only-testing:QBankTests/* | -only-testing:QBankUITests/*) ;;
                  *)
                    printf 'not a test flag: %q\n' "$flag" >&2
                    exit 1
                    ;;
                esac
              done
              ;;
            *)
              printf 'bad suite plan: %q\n' "$args" >&2
              exit 1
              ;;
          esac
          ./test/sim.sh --timeout 5400 --device "iPhone 17 Pro" --device "iPhone 17" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -collect-test-diagnostics never \
              -resultBundlePath TestResults.xcresult \
              "${only[@]}"

      # The full suite runs the same tests on an iPad: the iPad layout's UI
      # tests run there, and the iPhone layout's skip themselves. A quick check
      # starts this simulator only when a changed UI test class runs on iPad.
      # One class holds most of the iPad tests, so a second worker here made
      # this step slower, not faster.
      - name: Build and run unit and UI tests on iPad
        id: ipad-tests
        if: needs.scope.outputs.ipad != 'false'
        env:
          PR_SUITE: ${{ needs.scope.outputs.plan }}
        run: |
          args="$(printf '%s\n' "$PR_SUITE" | ./test/pr-suite.sh --flags ipad)"
          only=()
          case "$args" in
            none)
              echo "No changed UI test runs on iPad."
              exit 0
              ;;
            full) ;;
            -only-testing:*)
              set -f
              # shellcheck disable=SC2206 # flags are validated words with no spaces
              only=($args)
              set +f
              for flag in "${only[@]}"; do
                case "$flag" in
                  -only-testing:QBankUITests/*) ;;
                  *)
                    printf 'not a test flag: %q\n' "$flag" >&2
                    exit 1
                    ;;
                esac
              done
              ;;
            *)
              printf 'bad suite plan: %q\n' "$args" >&2
              exit 1
              ;;
          esac
          ./test/sim.sh --timeout 2700 --device "iPad Pro 13-inch (M5)" --device "iPad Pro 13-inch (M4)" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -collect-test-diagnostics never \
              -resultBundlePath TestResults-iPad.xcresult \
              "${only[@]}"

      # The Mac uploads at about 1 MB/s, and the largest bundle so far (224 MB)
      # took under 5 minutes. When an upload stalls, the action reports it after 5
      # minutes but keeps running until every byte is sent, and never saves the
      # artifact, so only this limit frees the runner (see docs/ci.md). The job has
      # already failed, so the limit cannot change its result. Only the device
      # that failed uploads: the iPad runs only after the iPhone passes.
      - name: Upload test results on failure
        if: failure()
        timeout-minutes: 6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ steps.ipad-tests.outcome == 'failure' && 'TestResults-iPad.xcresult' || 'TestResults.xcresult' }}
          retention-days: 14
          if-no-files-found: ignore

  # A manual run with only_testing runs those tests and nothing else: the retry
  # for one failed test (see docs/testing.md). A pull request can never start it.
  # It has its own check name, so its pass is never taken for a full build's, and
  # its own concurrency group, so its wait never replaces a full build of main.
  # It runs only on MAC_RUNNER, never on a GitHub-hosted Mac.
  named-tests:
    name: Named tests
    needs: scope
    if: >-
      needs.scope.outputs.mac == 'true' && github.event_name == 'workflow_dispatch' && inputs.only_testing != '' && vars.MAC_RUNNER != ''
    runs-on: ${{ github.event_name == 'pull_request' && 'qbank-macbook-14' || vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 45

    concurrency:
      group: ${{ format('xcode-named-{0}', github.ref_name) }}
      cancel-in-progress: true

    env:
      DERIVED_DATA_PATH: .build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      # The names are hostile input on a self-hosted Mac: only through env, never
      # into a shell line, and the script refuses anything but a test name.
      - name: Run only the named tests
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
          DEVICE: ${{ inputs.device }}
        run: ./test/only-testing.sh --device "$DEVICE"

      # The same limit as the full build's upload, for the same reason.
      - name: Upload test results on failure
        if: failure()
        timeout-minutes: 6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults-named.xcresult
          retention-days: 14
          if-no-files-found: ignore
