name: Xcode

# Builds and tests the app on a Mac. Runs only for trusted code: pull requests
# from this repository's own branches, pushes to main, qbank-v* tags, and
# manual runs. A fork's pull request never reaches the Mac (see docs/ci.md).
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'qbank-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A pull request or a push to main builds only on the self-hosted MAC_RUNNER.
  # With no MAC_RUNNER the build would fall back to a GitHub-hosted Mac on every
  # merge, so it is skipped and this job says why. It also says why a fork's
  # pull request skips the build.
  mac-build-skipped:
    name: Mac build skipped
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != 'D-e-e-g/qbank'
      || vars.MAC_RUNNER == '' && (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Explain the skip
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            message="This pull request comes from a fork, so it skips the Mac build: the self-hosted Mac builds only this repository's own branches (see docs/ci.md)."
          else
            message="MAC_RUNNER is not set, so this run skips the Mac build. Set it to the self-hosted runner's label (see docs/ci.md)."
          fi
          echo "::notice title=Mac build skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  # A pull request builds only when it comes from a branch of this repository,
  # never a fork, and only on the MacBook Pro 14's runner, whose job-started
  # hook checks the same thing again; never on a GitHub-hosted Mac.
  build-and-test:
    name: Build and test
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'D-e-e-g/qbank' && vars.MAC_RUNNER != ''
      || github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.MAC_RUNNER != '')
    runs-on: ${{ github.event_name == 'pull_request' && 'qbank-macbook-14' || vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 90

    # A pull request's new commit cancels its previous build. Every other run
    # shares one group, because a self-hosted MAC_RUNNER shares its Mac with
    # other CI: a new run waits for the running one, and GitHub keeps one
    # waiting run and replaces it with a newer one, so a burst of pushes to
    # main builds the latest. The one runner on the Mac runs one job at a time.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('xcode-pr-{0}', github.event.pull_request.number) || 'xcode-mac' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      PROJECT_PATH: QBank.xcodeproj
      SCHEME: QBank
      DERIVED_DATA_PATH: .build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEVELOPER_DIR, not `sudo xcode-select`: a self-hosted MAC_RUNNER has no
      # passwordless sudo, and GITHUB_ENV carries the choice to later steps.
      # /Applications/Xcode.app is the image's default Xcode on GitHub's Macs
      # and the App Store install on a self-hosted one.
      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Swift packages
        run: ./test/package-tests.sh

      # test/sim.sh owns the simulator: it creates one run-scoped device, boots
      # it, and deletes it on every exit path. Never target a simulator here
      # directly. After a failure xcodebuild would gather simulator diagnostics,
      # which can wait without end; the result bundle is uploaded instead.
      # The iPhone runs every UI test one after another. sim.sh's 60-minute
      # default leaves headroom for the full suite while still stopping hangs.
      - name: Build and run unit and UI tests
        run: |
          ./test/sim.sh --device "iPhone 17 Pro" --device "iPhone 17" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -collect-test-diagnostics never \
              -resultBundlePath TestResults.xcresult

      # The same tests on an iPad: the iPad layout's UI tests run there, and the
      # iPhone layout's skip themselves.
      - name: Build and run unit and UI tests on iPad
        run: |
          ./test/sim.sh --device "iPad Pro 13-inch (M5)" --device "iPad Pro 13-inch (M4)" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -collect-test-diagnostics never \
              -resultBundlePath TestResults-iPad.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults-iPad.xcresult
          retention-days: 14
          if-no-files-found: ignore

      # The Debug-only launch seam can compile in Debug yet break a Release
      # build. This compiles Release for a device with no signing, which is the
      # same compiler boundary a TestFlight archive crosses.
      - name: Build Release configuration (compile only)
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
