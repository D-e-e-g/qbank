name: Xcode

# Builds and tests the app on a Mac. Runs only for trusted code: pushes to
# main, qbank-v* tags, and manual runs. It must never run on pull requests,
# because MAC_RUNNER may point at a self-hosted Mac (see docs/ci.md).
on:
  push:
    branches:
      - main
    tags:
      - 'qbank-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A push to main builds only on the self-hosted MAC_RUNNER. With no
  # MAC_RUNNER the build would fall back to a GitHub-hosted Mac on every merge,
  # so it is skipped and this job says why.
  mac-runner-unset:
    name: Mac build skipped
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MAC_RUNNER == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Explain the skip
        run: |
          message="MAC_RUNNER is not set, so this push to main skips the Mac build. Set it to the self-hosted runner's label (see docs/ci.md)."
          echo "::notice title=Mac build skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build and test
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.MAC_RUNNER != ''
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 90

    # One Mac job at a time across every run of this workflow, because a
    # self-hosted MAC_RUNNER shares its Mac with other CI. A new run waits for
    # the running one; GitHub keeps one waiting run and replaces it with a newer
    # one, so a burst of pushes to main builds the latest.
    concurrency:
      group: xcode-mac
      cancel-in-progress: false

    env:
      PROJECT_PATH: QBank.xcodeproj
      SCHEME: QBank
      DERIVED_DATA_PATH: .build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEVELOPER_DIR, not `sudo xcode-select`: a self-hosted MAC_RUNNER has no
      # passwordless sudo, and GITHUB_ENV carries the choice to later steps.
      # /Applications/Xcode.app is the image's default Xcode on GitHub's Macs
      # and the App Store install on a self-hosted one.
      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Swift packages
        run: ./test/package-tests.sh --macos

      # test/sim.sh owns the simulator: it creates one run-scoped device, boots
      # it, and deletes it on every exit path. Never target a simulator here
      # directly. After a failure xcodebuild would gather simulator diagnostics,
      # which can wait without end; the result bundle is uploaded instead.
      # The iPhone runs every UI test one after another. sim.sh's 60-minute
      # default leaves headroom for the full suite while still stopping hangs.
      - name: Build and run unit and UI tests
        run: |
          ./test/sim.sh --device "iPhone 17 Pro" --device "iPhone 17" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -collect-test-diagnostics never \
              -resultBundlePath TestResults.xcresult

      # The same tests on an iPad: the iPad layout's UI tests run there, and the
      # iPhone layout's skip themselves.
      - name: Build and run unit and UI tests on iPad
        run: |
          ./test/sim.sh --device "iPad Pro 13-inch (M5)" --device "iPad Pro 13-inch (M4)" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -collect-test-diagnostics never \
              -resultBundlePath TestResults-iPad.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults-iPad.xcresult
          retention-days: 14
          if-no-files-found: ignore

      # The Debug-only launch seam can compile in Debug yet break a Release
      # build. This compiles Release for a device with no signing, which is the
      # same compiler boundary a TestFlight archive crosses.
      - name: Build Release configuration (compile only)
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
