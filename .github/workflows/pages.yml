# Publishes site/ (the privacy, support, and question-file-format pages) with
# GitHub Pages at https://qbank-app.dimitrygallego.com. It runs on pushes to main
# that change the site or what the format page is made from, and by hand. site/ is
# plain static files; the one build step renders the format page again from the
# pinned API contract. See docs/ci.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/render-format-page.rb"
      - "scripts/site_page.rb"
      - "Packages/QBankKit/Tests/QBankKitTests/Fixtures/openapi.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish site/
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the question file format page from the pinned contract
        run: ruby scripts/render-format-page.rb
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
