# Code-line limit for hand-written source. A code line is not blank and not
# only a comment. docs/ci.md says how to read and update this file.
#
# Nothing vendored and no lockfile is tracked. If one is added, exclude it
# here with a reason.

limit 1000

# Hand-written source this repository's tooling checks, tests included.
include *.swift
include *.sh

# Generated output and copied schemas.
exclude Packages/QBankKit/Tests/QBankKitTests/Fixtures/openapi.json Pinned copy of the server OpenAPI document, not hand-written source.

# Data fixtures and snapshots.
exclude Packages/QBankKit/Tests/QBankKitTests/Fixtures/ Recorded API responses and contract snapshots.
exclude Packages/QBankDesign/Tests/QBankDesignTests/Fixtures/ Design-token snapshots copied from the web app.

# Build output.
exclude build/ Local build output.

# Non-code assets.
exclude QBank/Assets.xcassets/ Image sets and asset-catalog metadata.
exclude docs/ Documentation and screenshots.
exclude *.png Image files.
exclude *.svg Image files.

# Tracked files this repository does not count as source.
exclude *.json Data files, not hand-written source.
exclude *.css Design-token snapshot stylesheets copied from the web app.
exclude *.md Documentation.
exclude *.ts Contract-recording scripts; this repository does not typecheck them.
exclude *.yml GitHub Actions workflow files, not application source.
exclude *.yaml Tool configuration, not application source.
exclude *.toml Tool configuration, not application source.
exclude *.plist Property-list configuration, not source.
exclude *.xcprivacy Privacy manifest, not source.
exclude *.entitlements App entitlements, not source.
exclude *.pbxproj Xcode project file, not source the compiler checks.
exclude *.xcscheme Xcode scheme, not source.
exclude .gitignore Git ignore rules, not source.
exclude test/record-contract/ TypeScript that records fixtures against a server checkout; this repository does not typecheck it.
exclude test/max-lines.rb The code-line checker. This repository runs it and does not lint Ruby.
exclude test/max-lines.conf The code-line limit configuration, not source.

# Files already over the limit, with the code-line count recorded for reference.
# A listed file is exempt until it is split: growing, or an entry whose file is
# gone or now at or under the limit, prints a warning and does not fail. The
# no-growth rule switches on when that file is split. Do not add a file.
allow Packages/QBankKit/Tests/QBankKitTests/ContractTests.swift 1243
allow QBank/Debug/FakeQBankServer.swift 1321
allow QBank/Debug/FakeStudy.swift 1221
allow QBank/Practice/AnswerViews.swift 1221
